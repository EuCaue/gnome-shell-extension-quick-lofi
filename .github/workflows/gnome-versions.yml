name: GNOME versions

on:
  workflow_dispatch:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gnome: [45, 46, 47, 48, 49, 50, 51]
    env:
      QL_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin libglib2.0-dev-bin libxml2-utils
      - run: npm ci
      # GNOME 49+ saves screenshots through a sandboxed helper; Ubuntu's AppArmor blocks the user namespace it needs
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run gnome:test -- ${{ matrix.gnome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-${{ matrix.gnome }}
          path: .shell-test/${{ matrix.gnome }}/
      # act --bind runs this job as root inside your checkout; give the files back to the checkout's owner
      - if: always()
        run: sudo chown -R "$(stat -c %u:%g .)" .
