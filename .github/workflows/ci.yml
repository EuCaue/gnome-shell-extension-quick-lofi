name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  shexli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin libglib2.0-dev-bin libxml2-utils
      - run: npm ci
      - run: npm run build:prod
      - run: pipx install 'shexli==0.2.1'
      - run: bash ./scripts/shexli.sh --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shexli-report
          path: .shexli/
